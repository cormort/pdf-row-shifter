<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 資料列分頁調整</title>
<style>
  :root{--bg:#e9eaee;--bar:#fbfbfd;--line:#d6d8de;--ink:#22252b;--dim:#6b7280;--acc:#4285f4}
  body{font:13px/1.5 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  #ctl{position:sticky;top:0;background:var(--bar);padding:7px 12px;z-index:10;border-bottom:1px solid var(--line);
       box-shadow:0 1px 6px #0000001a;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
  /* 工具列分組：同一組貼在一起，組與組之間留白＋細分隔線 */
  #ctl .g{display:flex;align-items:center;gap:4px;padding-right:5px;margin-right:5px;border-right:1px solid var(--line)}
  #ctl .g:last-of-type{border:0}
  #ctl label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:var(--dim)}
  #ctl input[type=checkbox]{accent-color:var(--acc);margin:0}
  #ctl input[type=number]{font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
  #ctl input[type=file]{max-width:190px;font-size:12px;color:var(--dim)}
  #ctl input[type=file]::file-selector-button{font:inherit;padding:3px 9px;margin-right:6px;border:1px solid var(--line);
       border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
  #ctl input[type=file]::file-selector-button:hover{border-color:var(--acc);color:var(--acc)}
  #ctl .lbl{color:var(--dim)}
  #ctl .lbl b{font-weight:600;color:var(--ink)}
  #ctl .pri{background:var(--acc);border-color:var(--acc);color:#fff}
  #ctl .pri:hover{background:#3b78e7;border-color:#3b78e7;color:#fff}
  #msg{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
  #out{padding:14px 0}
  /* contain:paint 是必要的：對開時內層有兩頁寬，只用 overflow:hidden 列印仍會被算進版面寬度，
     Chrome 就會把整份文件縮小以「符合寬度」，印出來變一半大小 */
  .page{background:#fff;box-shadow:0 2px 10px #00000024;position:relative;overflow:hidden;contain:paint;flex:none}
  /* safe center：視窗塞不下（對開時常見）就改成靠左，否則置中會把左半頁推到 x<0，
     那塊捲不回來也看不到。溢出的右側交給整頁的橫向捲軸 */
  .sheet{display:flex;gap:4px;justify-content:safe center;margin-bottom:10px;width:fit-content;min-width:100%}
  /* 原檔中文多為微軟正黑、數字多為 Times New Roman，分開對應才不會整份變同一種字 */
  :root{--serif:"Times New Roman",Times,serif}
  .seg,.row{position:absolute;white-space:pre;font-family:"Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif}
  .row{cursor:grab}
  .row:hover{outline:1px dashed #4285f4;background:#e8f0fe80}
  .row.sel{background:#fff3cd}
  .row.grp{box-shadow:inset 2px 0 0 #34a853}
  .seg[data-p]{cursor:text}
  body.edit .row{cursor:default}
  body.edit .row:hover{outline:none;background:none}
  body.edit .seg[data-p]:hover{outline:1px dotted #4285f4;background:#e8f0fe}
  .seg.editing{outline:1px solid #4285f4;background:#fff;z-index:5;min-width:1em}
  .seg.pick{outline:1px solid #ea4335;background:#fce8e6;z-index:4}
  @media print{.seg.pick{outline:none;background:none}}
  @media print{.row.sel{background:none}.row.grp{box-shadow:none}}
  .ln{position:absolute;background:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .gd{position:absolute;left:0;width:100%;border-top:1px dashed #ea4335;pointer-events:none}
  @media print{.gd{display:none}}
  .brk{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--dim);font-size:12px;
       margin:0 auto 14px;padding:5px 12px;width:fit-content;background:#ffffffb3;border:1px solid var(--line);border-radius:99px}
  .brk b{color:var(--ink);font-weight:600}
  .brk label{display:inline-flex;align-items:center;gap:4px}
  .brk input[type=checkbox]{accent-color:var(--acc);margin:0}
  button{font:inherit;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
         cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  button:hover:not(:disabled){border-color:var(--acc);color:var(--acc);background:#f5f9ff}
  button:active:not(:disabled){background:#e8f0fe}
  button:disabled{opacity:.4;cursor:default}
  @media print{
    @page{margin:0}   /* 實際紙張尺寸由 load() 依來源 PDF 動態寫入 #pagesize */
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #ctl,.brk{display:none}
    /* 這裡少一項就會每頁多吐一張空白紙：頁面盒剛好等於 A4，外圍任何留白都會溢位 */
    html,body,#out{width:auto;padding:0;margin:0;overflow:hidden}
    .sheet{display:block;gap:0;margin:0;padding:0;width:auto;min-width:0}   /* 畫面用的 min-width:100% 不能帶進列印，會撐寬版面 */
    .page{box-shadow:none;margin:0;break-after:page;break-inside:avoid}
    .sheet:last-child .page:last-child{break-after:avoid}   /* 不然結尾會多一張空白頁 */
  }
</style>

<style id="pagesize"></style>

<div id="ctl">
  <span class="g">
    <input type="file" id="f" accept="application/pdf">
    <label><input type="checkbox" id="spread"> 對開表</label>
  </span>
  <span class="g">
    <label title="表身上下留白，避免字壓到天地線">邊界 上<input type="number" id="padT" value="2" min="0" max="60" step="1" style="width:3.4em">
      下<input type="number" id="padB" value="2" min="0" max="60" step="1" style="width:3.4em">pt</label>
    <label title="表尾註第一列距地線多遠（只影響註，與上下邊界無關）">註起始<input type="number" id="noteY" value="0" min="0" max="200" step="1" style="width:3.8em">pt</label>
    <label title="列高再怎麼壓縮都不低於這個值">最小列高<input type="number" id="minLh" value="0" min="0" max="60" step="0.5" style="width:3.8em">pt</label>
    <label title="畫出表身上下界（只在畫面上，不會印出來）"><input type="checkbox" id="guide" checked> 輔助線</label>
  </span>
  <span class="g">
    <button id="avgAll" title="所有頁面的列都平均分佈到表身底端">平均列高：全部頁面</button>
    <button id="freeze" title="把目前每一個分頁點都鎖起來，之後不會被推拉動到">🔒 凍結分頁</button>
    <button id="unfreeze" title="解開所有鎖定的分頁點（分頁位置不變）">🔓 清除鎖定</button>
  </span>
  <span class="g">
    <button id="bu" onclick="undo()" title="復原">↩</button>
    <button id="br" onclick="redo()" title="重做">↪</button>
    <button onclick="group()" title="把選取的連續列綁成一組，分頁不會拆開">組成群組</button>
    <button onclick="ungroup()" title="解除選取列的群組">解除群組</button>
    <button onclick="sel.clear();render()" title="取消目前的列選取">取消選取</button>
  </span>
  <span class="g" title="按住修飾鍵點格子選取，再按對齊鈕">
    <span class="lbl">對齊 <b id="kAlt">Alt</b>＋點</span>
    <button onclick="align('l')" title="靠左對齊">⇤</button>
    <button onclick="align('c')" title="水平置中">⇔</button>
    <button onclick="align('r')" title="靠右對齊">⇥</button>
    <button onclick="align('d')" title="水平均分">⇹</button>
    <button onclick="align('col')" title="依欄線置中">⊞</button>
  </span>
  <span class="g">
    <label title="點格子直接改字"><input type="checkbox" id="editMode"> 編輯文字</label>
    <button class="pri" onclick="print()">列印 / 存成 PDF</button>
  </span>
  <span id="msg"></span>
</div>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const U=pdfjsLib; U.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// 按鍵標示依平台換：Mac 用 ⌘/⌥，Windows、Linux 用 Ctrl/Alt
const MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const KMOD=MAC?'⌘':'Ctrl', KALT=MAC?'⌥':'Alt';
kAlt.textContent=KALT;
bu.title=`復原 (${KMOD}Z)`; br.title=`重做 (${MAC?'⇧⌘Z':'Ctrl+Shift+Z'})`;

// 版面（固定，不隨資料跑）：W/H 頁面尺寸、frame 天地線與欄線、head 固定頁首、bodyTop/LH 表身格線
// units[i] = 一個可搬動單位（1 列，或群組後的多列）；breaks 以 unit 為索引
let minLH=0;
const avgPg=new Set();        // 要平均列高的頁（非最後一頁本來就是平均的）
const locks=new Set();        // 鎖住的分頁點，以「第幾個 unit 之後斷頁」記，不受其他頁增減影響
let W=595,pageW=595,H=842, frame=[], head=[], note=[], rows=[], units=[], breaks=[], PADT=2, PADB=2, NOTEY=0, topY=0, bodyTop=0, bodyBot=800, bottomY=800, fillY=800, LH=7, perPage=1;
const sel=new Set();

let buf=null;
// load() 中間有多個 await，連續換檔／切對開會兩份同時跑、互相蓋掉全域狀態（列數、行高全亂）。
// 排隊跑，最後一次的結果就是畫面上的結果。
let loading=Promise.resolve();
const queueLoad=()=>{ loading=loading.then(load, load).catch(e=>console.error(e)); };
f.onchange = e => { buf=e.target.files[0]; queueLoad(); };
spread.onchange = () => buf && queueLoad();
padT.oninput = padB.oninput = () => { PADT=+padT.value||0; PADB=+padB.value||0; units.length && relayout(); };
// 註起始＝第一列註距地線的 pt；其餘註列維持彼此的相對距離
noteY.oninput = () => { NOTEY=+noteY.value||0; units.length && render(); };
guide.onchange = () => units.length && render();
minLh.oninput = () => { minLH=+minLh.value||0; units.length && render(); };
// 全部頁面：有任何一頁還沒平均就全開，都開了就全關
freeze.onclick = () => { breaks.slice(0,-1).forEach(b=>locks.add(b)); render(); };
unfreeze.onclick = () => { locks.clear(); render(); };
avgAll.onclick = () => { const on=avgPg.size<breaks.length; avgPg.clear();
  if(on) breaks.forEach((_,i)=>avgPg.add(i)); render(); };
editMode.onchange = () => { document.body.classList.toggle('edit', editMode.checked); units.length && render(); };

async function load(){
  const doc = await U.getDocument(await buf.arrayBuffer()).promise;
  // 對開：奇數頁是左半、偶數頁是右半，兩頁併成一個「版」（右半的 x 平移一個頁寬）
  const N = spread.checked ? 2 : 1;
  const all=[];
  for(let p=1;p<=doc.numPages;p+=N){
    let txt=[], fr=[];
    for(let k=0;k<N && p+k<=doc.numPages;k++){
      const pg=await doc.getPage(p+k), vp=pg.getViewport({scale:1});
      pageW=vp.width; H=vp.height;
      const dx=k*pageW;
      const c=await pg.getTextContent();
      await pg.getOperatorList();          // 跑過才會把字型載進 commonObjs，粗體資訊在那裡
      txt.push(...lines(c, H, fonts(pg,c)).map(r=>shift(r,dx)));
      if(p===1) fr.push(...(await getFrame(pg,H)).map(l=>({...l, x:l.x+dx})));
    }
    W = pageW*N;
    if(p===1) frame=fr;
    all.push(merge(txt));
  }
  // 固定頁首 = 表頭橫線以上的內容（首頁一份、續頁一份，原樣不動）
  const hy = spanning(frame);
  bottomY = hy[hy.length-1];
  // 表頭那幾條橫線彼此靠得近，資料區則是一大段空白；斷在第一個大間距處
  let si=0; while(si+1<hy.length-1 && hy[si+1]-hy[si]<100) si++;
  const sep = hy[si];
  // 地線以下：純數字（≤2 段）是頁碼，跟著頁首走；其餘是表尾註，只畫在最後一頁
  const isPgNo = r => r.length<=2 && r.every(s=>/^\d+$/.test(s.t));
  head = all.map(pg=>pg.filter(r=>r.y<=sep || (r.y>bottomY && isPgNo(r))));
  // 註通常每頁都有一份，依內容去重，最後一頁只畫一次
  note=[]; const seen=new Set();
  all.forEach(pg=>pg.filter(r=>r.y>bottomY && !isPgNo(r)).forEach(r=>{
    const k=r.map(s=>s.t).join(''); if(!seen.has(k)){ seen.add(k); note.push(r); }
  }));
  // 註起始預設沿用原檔（第一列註距地線多遠）
  NOTEY = note.length ? +(note[0].y-bottomY).toFixed(1) : 0;
  noteY.value = NOTEY; noteY.parentElement.style.display = note.length?'':'none';

  rows=[]; units=[]; breaks=[]; sel.clear(); undoS=[]; redoS=[]; selSeg.clear();
  avgPg.clear(); locks.clear(); minLH=0; dragI=lastI=null;
  all.forEach(pg=>{
    const body=pg.filter(r=>r.y>sep && r.y<=bottomY);
    rows.push(...body); units.push(...body.map(r=>[r]));
    breaks.push(units.length);
  });
  if(!rows.length){ alert('表身範圍內找不到可調整的資料列（需為文字型 PDF，且表格有橫貫全寬的天地線）'); out.innerHTML=''; return; }

  // 表身格線：起始 y 與行高取自原檔
  topY = rows[0].y;
  const gaps = rows.slice(1,40).map((r,i)=>r.y-rows[i].y).filter(g=>g>1);
  LH = gaps.sort((a,b)=>a-b)[Math.floor(gaps.length/2)] || 7;
  // 紙張尺寸跟著來源 PDF 走；寫死 A4 的話，非 A4 的原稿列印時會被整份縮小
  pagesize.textContent=`@page{size:${pageW}pt ${H}pt;margin:0}`;
  relayout();
};

// 上下各留 PADT / PADB 的邊界，字才不會壓在天地線／表頭線上；改邊界只要重算這幾個值再重畫
function relayout(){
  bodyTop = topY + PADT;
  bodyBot = bottomY - PADB;
  // 表身底端 = 原檔最滿的一頁最後一列的位置，用它當各頁對齊的基準
  const maxLines = Math.max(...breaks.map((e,i)=>nlines(i?breaks[i-1]:0, e)));
  fillY = Math.min(bodyBot, bodyTop + (maxLines-1)*LH);
  // 最小列高預設為原行高的 60%，再緊就不好看了；使用者可在工具列改
  if(!minLH){ minLH=+(LH*.6).toFixed(1); minLh.value=minLH; }
  render();
}

// 文字依 y 分列（3pt 內同列），座標轉為由上而下
// 從字型名稱取粗體與襯線與否（例：TimesNewRomanPS-BoldMT → 粗體＋襯線）
function fonts(pg,c){
  const m={};
  for(const fn of Object.keys(c.styles||{})){
    let nm=''; try{ nm=(pg.commonObjs.get(fn)||{}).name||''; }catch(e){}
    m[fn]={ b:/bold|black|heavy|semib/i.test(nm), s:/times|serif|roman|georgia|mingliu|song|kai/i.test(nm) };
  }
  return m;
}

function lines(c,H,ft={}){
  const its=c.items.filter(i=>i.str.trim())
    .map(i=>({x:i.transform[4], y:H-i.transform[5], t:i.str, w:i.width,
              b:(ft[i.fontName]||{}).b?1:0, s:(ft[i.fontName]||{}).s?1:0,
              sz:Math.hypot(i.transform[2],i.transform[3])}))
    .sort((a,b)=>a.y-b.y);
  const out=[]; let cur=null;
  for(const it of its){
    // 同一列裡中文與數字的基線常常差好幾 pt（正黑與 Times 的垂直對位不同，實測 3.26pt），
    // 固定 3pt 會把一列切成兩列、行高中位數整個崩掉。門檻改成跟字級走：
    // 半個字級遠比列距（≥ 一個字級）小，切得開換行，又併得回同列的中文與數字。
    if(!cur || it.y-cur.y>rowTol(cur.sz,it.sz)){ cur={y:it.y, sz:it.sz, segs:[]}; out.push(cur); }
    else cur.sz=Math.max(cur.sz,it.sz);
    cur.segs.push(it);
  }
  return out.map(r=>Object.assign(r.segs.sort((a,b)=>a.x-b.x),{y:r.y}));
}
const shift=(r,dx)=>Object.assign(r.map(s=>({...s,x:s.x+dx})),{y:r.y});
// 分列門檻：至少 3pt，字級大的表就跟著放寬到半個字級
const rowTol=(a,b)=>Math.max(3, Math.max(a||0,b||0)*.5);
const rowSz=r=>Math.max(0,...r.map(s=>s.sz||0));
// 對開時左右兩半各自分好列，這裡再依 y 把同一列的左右內容併起來
function merge(rs){
  rs.sort((a,b)=>a.y-b.y);
  const out=[];
  for(const r of rs){
    const p=out[out.length-1];
    if(p && r.y-p.y<rowTol(rowSz(p),rowSz(r))) p.push(...r);
    else out.push(Object.assign([...r],{y:r.y}));
  }
  return out.map(r=>Object.assign(r.sort((a,b)=>a.x-b.x),{y:r.y}));
}

// 取頁面框線（水平/垂直的直線段）
async function getFrame(pg,H){
  const ops=await pg.getOperatorList(), OPS=U.OPS, out=[];
  // 路徑座標在目前的 CTM 之下，得自己追 transform / save / restore
  // lw 預設 1（PDF 規格的預設線寬）。用 0.5 的話，沒下 setLineWidth 的檔（例：03-參考-OF-01-主要營運）
  // 天地線的兩道 1pt 相接線會因為厚度算太細而併不起來，變成裂開的兩條細線。
  // 明確寫 w 0 是 hairline，維持當 0.5 處理（03-參考-OF-07-長債 實測相符）。
  let m=[1,0,0,1,0,0], stack=[], lw=1;
  const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1],
                    a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3],
                    a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
  const app=(x,y)=>[m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]];
  for(let i=0;i<ops.fnArray.length;i++){
    const fn=ops.fnArray[i];
    if(fn===OPS.save){ stack.push([m,lw]); continue; }          // 線寬也是圖形狀態，要跟著 q/Q 存回
    if(fn===OPS.restore){ const s=stack.pop(); if(s){ m=s[0]; lw=s[1]; } continue; }
    if(fn===OPS.transform){ m=mul(m, ops.argsArray[i]); continue; }
    if(fn===OPS.setLineWidth){ lw=ops.argsArray[i][0]*Math.hypot(m[0],m[1]) || .5; continue; }
    if(fn!==OPS.constructPath) continue;
    const [cmds,raw]=ops.argsArray[i];
    const co=[]; for(let j=0;j<raw.length;j+=2){ const p=app(raw[j],raw[j+1]); co.push(p[0],p[1]); }
    let k=0,px=0,py=0;
    for(const cm of cmds){
      if(cm===OPS.moveTo){ px=co[k++]; py=co[k++]; }
      else if(cm===OPS.lineTo){
        const x=co[k++], y=co[k++];
        if(Math.abs(y-py)<.5) out.push({x:Math.min(px,x), y:H-y, w:Math.abs(x-px), h:0, t:lw});
        else if(Math.abs(x-px)<.5) out.push({x, y:H-Math.max(py,y), w:0, h:Math.abs(y-py), t:lw});
        px=x; py=y;
      }
      else if(cm===OPS.rectangle){
        const [x0,y0]=app(raw[k],raw[k+1]), [x1,y1]=app(raw[k]+raw[k+2],raw[k+1]+raw[k+3]);
        k+=4;
        const x=Math.min(x0,x1), w=Math.abs(x1-x0), t=H-Math.max(y0,y1), h=Math.abs(y1-y0);
        px=x1; py=y1;
        // 這類 PDF 的框線是「很扁的矩形」；長寬都大的是色塊（整頁底色），不是線
        if(Math.min(w,h)>2) continue;
        // 扁矩形當線，厚度就是它的短邊（例：這類公文表的框線是 0.75pt）
        if(h<=2) out.push({x,y:t+h/2,w,h:0,t:h||.5});
        else out.push({x:x+w/2,y:t,w:0,h,t:w||.5});
        continue; }
      else k+=cm===OPS.curveTo?6:2;
    }
  }
  // 只留細長的框線，濾掉整頁底色之類的大色塊
  return mergeLines(out.filter(l=>(l.w||l.h)>2));
}

// 有些表的天地線是兩道細線相接畫成的（例：y=84 與 85 各 1pt，其實是一條 2pt）。
// 先把厚度相接／重疊、而且長度方向有交集的同向線併起來，之後吸附像素才不會裂成兩條。
// 真正有間隙的雙線（例如 hairline 畫的雙橫線）不會被併，維持原樣。
function mergeLines(ls){
  const out=[];
  for(const ori of [0,1]){                       // 0=水平 1=垂直
    const g=ls.filter(l=>(ori? l.h : l.w)>0).map(l=>({...l}));
    const key=l=>ori? l.x : l.y;                 // 粗細方向的中心
    const t=l=>l.t||.5;
    g.sort((a,b)=>key(a)-key(b));
    const used=new Array(g.length).fill(false);
    g.forEach((a,i)=>{
      if(used[i]) return;
      let lo=key(a)-t(a)/2, hi=key(a)+t(a)/2;
      let s=ori? a.y : a.x, e=s+(ori? a.h : a.w);
      for(let j=i+1;j<g.length;j++){
        const b=g[j]; if(used[j]) continue;
        const blo=key(b)-t(b)/2, bhi=key(b)+t(b)/2;
        if(blo>hi+.01) break;                    // 已排序，再往後只會更遠
        const bs=ori? b.y : b.x, be=bs+(ori? b.h : b.w);
        if(be<s-.01 || bs>e+.01) continue;       // 長度方向沒交集，不是同一條
        lo=Math.min(lo,blo); hi=Math.max(hi,bhi); s=Math.min(s,bs); e=Math.max(e,be);
        used[j]=true;
      }
      used[i]=true;
      const c=(lo+hi)/2, th=hi-lo;
      out.push(ori? {x:c, y:s, w:0, h:e-s, t:th} : {x:s, y:c, w:e-s, h:0, t:th});
    });
  }
  return out;
}

// 橫貫整個表寬的橫線 y（表頭裡的短分隔線不算），由上而下
function spanning(fr){
  const hs=fr.filter(l=>!l.h);
  if(!hs.length) return [0,H];
  const L=Math.min(...hs.map(l=>l.x)), R=Math.max(...hs.map(l=>l.x+l.w));
  const by=new Map();
  hs.forEach(l=>{ const k=Math.round(l.y); (by.get(k)||by.set(k,[]).get(k)).push([l.x,l.x+l.w]); });
  const full=[...by].filter(([y,segs])=>{
    let cov=0, end=-1e9;
    segs.sort((a,b)=>a[0]-b[0]).forEach(([a,b])=>{ cov+=Math.max(0,b-Math.max(a,end)); end=Math.max(end,b); });
    return cov >= (R-L)*.9;
  }).map(([y])=>y).sort((a,b)=>a-b);
  return full.length>1 ? full : [...by.keys()].sort((a,b)=>a-b);
}

// ── 復原 / 重做：每次動作前存一份 units+breaks 快照（列本身唯讀，淺拷貝就夠） ──
let undoS=[], redoS=[];
const snap=()=>({u:units.map(u=>[...u]), b:breaks.slice(), h:head.map(p=>[...p]), n:[...note], l:[...locks]});
const push=()=>{ undoS.push(snap()); redoS=[]; if(undoS.length>100) undoS.shift(); };
// locks 以 unit 索引記，跟著 breaks 一起還原，不然復原後鎖會指到不存在的分頁點
function restore(s){ units=s.u; breaks=s.b; head=s.h; note=s.n;
  locks.clear(); s.l.forEach(b=>locks.add(b)); sel.clear(); render(); }
function undo(){ if(!undoS.length) return; redoS.push(snap()); restore(undoS.pop()); }
function redo(){ if(!redoS.length) return; undoS.push(snap()); restore(redoS.pop()); }
onkeydown = e => {
  if(!(e.metaKey||e.ctrlKey) || e.key.toLowerCase()!=='z') return;
  e.preventDefault(); e.shiftKey ? redo() : undo();
};

const nlines=(a,b)=>units.slice(a,b).reduce((n,u)=>n+u.length,0);
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
const th=l=>l.t||.5;
const snapPx=pt=>Math.round(pt*96/72);       // pt → 整數 CSS px

// 線條的粗細方向吸附到整數像素（長度方向維持原值，不影響接合）
function lnBox(l,k){
  const t=th(l), x=l.x-k*pageW;
  return l.w
    ? `left:${x}pt;top:${snapPx(l.y-t/2)}px;width:${l.w}pt;height:${Math.max(1,snapPx(t))}px`
    : `left:${snapPx(x-t/2)}px;top:${l.y}pt;width:${Math.max(1,snapPx(t))}px;height:${l.h}pt`;
}
function status(){
  msg.textContent=`${nlines(0,units.length)} 列 / 每頁上限 ${perPage} 列`
    + (sel.size?`　已選 ${sel.size} 列`:'') + (selSeg.size?`　已選 ${selSeg.size} 格`:'');
  bu.disabled=!undoS.length; br.disabled=!redoS.length;
  // 全部頁面那顆是切換鈕，名稱要跟著現在的狀態走
  const allOn = breaks.length && avgPg.size>=breaks.length;
  avgAll.textContent = allOn ? '取消平均列高：全部頁面' : '平均列高：全部頁面';
  freeze.disabled = locks.size>=breaks.length-1; unfreeze.disabled = !locks.size;
}

// 文字在 PDF 裡是以「基線」定位，但 CSS 的 top 是行框上緣，兩者相差多少要看實際字型的
// ascent，猜不得（Times 0.89、正黑 1.08）。實地量一次每種字型組合，之後直接換算。
const bo={};
function baseOff(sz,bold,serif){
  const k=`${sz}|${bold}|${serif}`;
  if(bo[k]!=null) return bo[k];
  const p=document.createElement('span');
  p.className='seg';                       // 一定要用跟正文相同的字型來量，否則 ascent 會不一樣
  p.style.cssText=`position:absolute;visibility:hidden;white-space:pre;font-size:${sz}pt;line-height:${sz}pt`
    +(bold?';font-weight:700':'')+(serif?';font-family:var(--serif)':'');
  p.textContent='X';
  const s=document.createElement('span');
  s.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
  p.appendChild(s); document.body.appendChild(p);
  const off=(s.getBoundingClientRect().top-p.getBoundingClientRect().top)*72/96;
  p.remove();
  return bo[k]=off;
}

// 從第 pi 頁往後，到下一個鎖定的分頁點（含該頁）為止
function segPages(pi){
  const out=[];
  for(let j=pi;j<breaks.length;j++){ out.push(j); if(locks.has(breaks[j])) break; }
  return out;
}

function render(){
  // 每頁上限跟著最小列高走，改「最小列高」時要一起更新，否則推拉列的上限會沿用舊值
  perPage = Math.floor((bodyBot-bodyTop)/(minLH||LH))+1;
  out.innerHTML='';
  let start=0;
  breaks.forEach((end,pi)=>{
    // 對開時直接產生兩張實體頁，各自只放自己那半邊的東西。
    // （不要用「雙頁寬圖層往左推＋overflow:hidden」——被遮住的元素仍算在版面寬度裡，
    //   Chrome 列印時會為了「符合寬度」把整份縮小。）
    const N=Math.round(W/pageW), sheet=document.createElement('div');
    sheet.className='sheet';
    const halves=[];
    for(let k=0;k<N;k++){
      const pageEl=document.createElement('div'); pageEl.className='page';
      pageEl.style.cssText=`width:${pageW}pt;height:${H}pt`;
      sheet.appendChild(pageEl); halves.push(pageEl);
    }
    frame.forEach(l=>{
      const k=Math.min(N-1,Math.floor(l.x/pageW));
      halves[k].insertAdjacentHTML('beforeend',
        // l.x / l.y 是線的中心，畫成方塊要退半個線寬；粗細方向再吸附到整數像素，
        // 否則落在半個像素上的線會被反鋸齒糊成兩三個像素，看起來比別條粗。
        `<div class=ln style="${lnBox(l, k)}"></div>`);
    });
    // 輔助線：上界畫在第一列文字的頂端（列框也是從基線退 0.8 行起算），下界畫在最後一列基線
    if(guide.checked) halves.forEach(h=>h.insertAdjacentHTML('beforeend',
      `<div class=gd style="top:${bodyTop-LH*.8}pt"></div><div class=gd style="top:${bodyBot}pt"></div>`));
    // 首頁用首頁頁首，續頁一律用第 2 頁的（含「（續）」），只換頁碼
    const hi = head[pi] ? pi : Math.min(1,head.length-1);
    head[hi].forEach((r,ri)=>halves.forEach((h,k)=>
      h.insertAdjacentHTML('beforeend', segs(r, r.y, false, pi*N+1, 0, `h,${hi},${ri}`, k))));
    // 行距微調：除了最後一頁，各頁的列都平均分佈到原檔的表身底端，
    // 少一列就稍微放寬、多一列就稍微壓縮，不會在頁尾留下一塊突兀的空白。
    const n=nlines(start,end);
    const last=pi===breaks.length-1;
    // 表尾註跟著表格結尾走：只畫在最後一頁，整塊平移到「地線 + 註起始」，內部行距不變
    const ndy = note.length ? bottomY+NOTEY-note[0].y : 0;
    if(last) note.forEach((r,ri)=>halves.forEach((h,k)=>
      h.insertAdjacentHTML('beforeend', segs(r, 0, false, 0, ndy, `n,0,${ri}`, k))));
    // 勾「平均列高」＝這頁的列平均分佈到表身底端（bodyBot）；
    // 沒勾時維持原行為：非最後一頁對齊「最滿那頁」的底端 fillY，最後一頁保留原行高。
    const avg = avgPg.has(pi), sp=Math.max(1,n-1);
    const lh = Math.max(minLH, avg ? (bodyBot-bodyTop)/sp
                             : !last ? (fillY-bodyTop)/sp
                                     : Math.min(LH,(bodyBot-bodyTop)/sp));
    let li=0;
    units.slice(start,end).forEach((u,i)=>{
      halves.forEach((h,k)=>{
        const e=document.createElement('div');
        e.className='row'+(sel.has(start+i)?' sel':'')+(u.length>1?' grp':'');
        // 框往上抬 0.8 行，讓可點擊範圍蓋住文字本身而不是它下面那行
        e.style.cssText=`left:0;top:${bodyTop+li*lh-lh*.8}pt;width:100%;height:${u.length*lh}pt`;
        e.draggable=!editMode.checked;   // 編輯模式下不拖曳，否則點字會變成拖列
      e.dataset.i=start+i;
        e.innerHTML=u.map((r,j)=>segs(r,0,true,0,j*lh+lh*.8,`u,${start+i},${j}`,k,lh/LH)).join('');
        h.appendChild(e);
      });
      li+=u.length;
    });
    out.appendChild(sheet);
    const b=document.createElement('div'); b.className='brk';
    const lk=locks.has(end);
    b.innerHTML=`<b>第 ${pi+1} 頁</b>　列高 ${lh.toFixed(1)}pt
      <label title="從本頁套用到下一個鎖定的分頁點為止"><input type=checkbox data-a=1 ${avg?'checked':''}> 平均列高（到下一個鎖定點）</label>`
      + (last?'':`　<button data-k=1 title="鎖住後這個分頁點不能移動">${lk?'🔒 已鎖':'🔓 鎖定'}</button>
        <button data-d="-1" ${lk?'disabled':''}>↓ 最後一列推到下頁</button>
        <button data-d="1" ${lk?'disabled':''}>↑ 下頁第一列拉上來</button>`);
    // 核取方塊走 change（點到 label 文字也算），按鈕走 click
    // 鎖定的分頁點是「段」的界線：從本頁一路套用到下一個鎖定點所在的那頁為止
    b.querySelector('[data-a]').onchange=ev=>{
      for(const j of segPages(pi)) ev.target.checked?avgPg.add(j):avgPg.delete(j);
      render();
    };
    b.onclick=ev=>{
      const t=ev.target.closest?.('button'); if(!t) return;
      if(t.dataset.k){ locks.has(end)?locks.delete(end):locks.add(end); return render(); }
      const v=+t.dataset.d; if(v) move(pi,v);
    };
    out.appendChild(b);
    start=end;
  });
  status();
  // 頁面容器落在半個像素上，裡面吸附過的線就會被反鋸齒攤成兩條；整頁往上挪回整數裝置像素。
  // 先清完再一次量完再一次寫，避免每頁一次 reflow
  const dpr=devicePixelRatio||1, pgs=[...out.querySelectorAll('.page')];
  pgs.forEach(p=>p.style.transform='');
  const tops=pgs.map(p=>p.getBoundingClientRect().top);
  pgs.forEach((p,i)=>p.style.transform=`translateY(${(Math.round(tops[i]*dpr)-tops[i]*dpr)/dpr}px)`);
  bindDrag(); bindEdit(); fitWidths();
}

function move(pi,d){
  if(locks.has(breaks[pi])) return;                             // 分頁點鎖定中
  const prev = pi===0?0:breaks[pi-1];
  if(d<0 && breaks[pi]-1<=prev) return;                        // 本頁不能空
  if(d>0){
    if(breaks[pi]+1>breaks[pi+1]) return;
    if(nlines(prev,breaks[pi]+1)>perPage) return;              // 不能超出地線
  }
  push();
  breaks[pi]+=d;
  breaks=breaks.filter((b,i)=>b>(i?breaks[i-1]:0));            // 搬空的頁就刪掉，不留空白頁
  remapLocks(b=>b);                                            // 頁被刪掉時，指向它的鎖也一併清掉
  render();
}

const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
// half = 只輸出落在第幾個半頁的片段，x 也換算成該半頁的座標
// kz = 列高壓縮比，用來等比縮放同列內部的基線落差（中文比數字低幾 pt 那種）
// （別叫 k：下面 map 的索引也叫 k，會把壓縮比蓋掉，基線落差變成「乘上第幾段」）
function segs(r, top, rel, pgno, dy=0, path='', half=0, kz=1){
  // 地線以下（頁尾）孤立的純數字視為頁碼，換成新頁次（對開時左右各自算）
  const pn=s=>pgno&&r.y>bottomY&&r.length<=2&&/^\d+$/.test(s.t);
  const txt=s=>pn(s) ? String(pgno+Math.floor(s.x/pageW)) : s.t;
  return r.map((s,k)=>[s,k]).filter(([s])=>Math.floor(s.x/pageW)===half)
    .map(([s,k])=>`<span class=seg ${pn(s)?'':`data-p="${path},${k}"`} ${s.w?`data-w="${s.w}"`:''} style="left:${s.x-half*pageW}pt;top:${(rel?dy+(s.y-r.y)*kz:s.y+dy)-baseOff(s.sz,s.b,s.s)}pt;font-size:${s.sz}pt;line-height:${s.sz}pt${s.b?';font-weight:700':''}${s.s?';font-family:var(--serif)':''}">${esc(txt(s))}</span>`).join('');
}

// 系統字型的字寬跟原檔內嵌字型不同，數字排出來會比原本寬、壓到欄線上。
// 量完之後把每段橫向壓回原檔寬度（只縮不放，從左緣起算，右對齊的數字才不會跑掉）。
function fitWidths(){
  const els=[...out.querySelectorAll('.seg[data-w]')];
  const scale=els.map(el=>{
    const w0=+el.dataset.w, w1=el.getBoundingClientRect().width*72/96;
    return w0>0 && w1>w0*1.005 ? w0/w1 : 0;                 // 先全部量完再寫，避免反覆重排
  });
  els.forEach((el,i)=>{ if(scale[i]){
    el.style.display='inline-block';
    el.style.transformOrigin='left top';
    el.style.transform=`scaleX(${scale[i].toFixed(4)})`;
  }});
}

// ── 對齊：⌥ 點格選取（可多選），再按對齊鈕，像 PPT 對齊文字方塊 ──
const selSeg=new Set();
const PT=el=>el.getBoundingClientRect().width / (out.querySelector('.page').getBoundingClientRect().width/pageW);

function align(mode){
  // 對開時同一格會有左右兩份 DOM（右半是複本），依 data-p 去重
  const seen=new Set(), els=[...out.querySelectorAll('.seg.pick')]
    .filter(el=>!seen.has(el.dataset.p) && seen.add(el.dataset.p));
  if(els.length<(mode==='col'?1:2)) return alert(`按住 ${KALT} 點選要對齊的格子，至少兩格`);
  const box=els.map(el=>({p:el.dataset.p, x:seg0(el.dataset.p).x, w:PT(el)}));
  const L=Math.min(...box.map(b=>b.x)), R=Math.max(...box.map(b=>b.x+b.w));
  push();
  if(mode==='l') box.forEach(b=>setX(b.p, L));
  if(mode==='r') box.forEach(b=>setX(b.p, R-b.w));
  if(mode==='c') box.forEach(b=>setX(b.p, (L+R)/2-b.w/2));
  if(mode==='d'){                                  // 中心點等距分佈，頭尾不動
    box.sort((a,b)=>a.x-b.x);
    const c0=box[0].x+box[0].w/2, cN=box.at(-1).x+box.at(-1).w/2;
    box.forEach((b,i)=>setX(b.p, c0+(cN-c0)*i/(box.length-1)-b.w/2));
  }
  if(mode==='col') box.forEach(b=>{                // 以左右兩條欄線置中
    const vs=frame.filter(l=>l.h).map(l=>l.x).sort((a,b)=>a-b);
    const lo=Math.max(...vs.filter(v=>v<=b.x+2), 0), hi=Math.min(...vs.filter(v=>v>=b.x+b.w-2), W);
    setX(b.p, (lo+hi)/2-b.w/2);
  });
  selSeg.clear(); render();
}
// data-p = 「u|h|n, 群組/頁索引, 列, 段」；n（表尾註）沒有分頁維度，a 恆為 0
const owner=(k,a)=> k==='u' ? units[a] : k==='n' ? note : head[a];
const seg0=p=>{ const [k,a,b,c]=p.split(','); return owner(k,a)[b][c]; };
function setX(p,x){
  const [k,a,b,c]=p.split(',');
  const o = owner(k,a);
  o[b] = Object.assign(o[b].map((s,i)=>i==c?{...s,x}:s), {y:o[b].y});
}

// ── 就地編輯：勾選「編輯」後點格子改字，Enter 或點別處存檔、Esc 放棄 ──
function bindEdit(){
  out.querySelectorAll('.seg[data-p]').forEach(el=>{
    if(selSeg.has(el.dataset.p)) el.classList.add('pick');
    el.onclick=ev=>{
      if(ev.altKey){                               // ⌥/Alt 點：選格子做對齊
        ev.stopPropagation(); ev.preventDefault();
        selSeg.has(el.dataset.p) ? selSeg.delete(el.dataset.p) : selSeg.add(el.dataset.p);
        out.querySelectorAll(`.seg[data-p="${el.dataset.p}"]`)
           .forEach(x=>x.classList.toggle('pick', selSeg.has(el.dataset.p)));
        status(); return;
      }
      if(editMode.checked) edit(el, ev);           // 編輯模式：點一下就改字
      // 否則不攔截，交給整列的點擊去做選取
    };
    el.ondblclick=ev=>edit(el, ev);                // 沒開編輯模式時，雙擊仍然可以改
  });
}

function edit(el, ev){
      if(el.isContentEditable) return;
      ev.stopPropagation();
      const row=el.closest('.row'); if(row) row.draggable=false;
      const old=el.textContent;
      el.contentEditable='true'; el.classList.add('editing'); el.focus();
      getSelection().selectAllChildren(el);
      const done=ok=>{
        el.contentEditable='false'; el.classList.remove('editing');
        const t=el.textContent;
        if(!ok || t===old){ el.textContent=old; if(row) row.draggable=true; return; }
        push(); setSeg(el.dataset.p, t); render();
      };
      el.onblur=()=>done(true);
      el.onkeydown=e=>{
        e.stopPropagation();
        if(e.key==='Enter'){ e.preventDefault(); el.blur(); }
        if(e.key==='Escape'){ el.textContent=old; el.blur(); }
      };
}
// data-p = "u,單位,行,片段" 或 "h,頁,列,片段"
// 改字時整列換成新物件（copy-on-write），舊快照才留得住原文，復原才有效
function setSeg(p,t){
  const [k,a,b,c]=p.split(',');
  const o = owner(k,a);
  // 改過字之後原本的寬度就不適用了，拿掉才不會把新字硬壓成舊寬度
  o[b] = Object.assign(o[b].map((s,i)=>i==c?{...s,t,w:0}:s), {y:o[b].y});
}

// ── 選取與群組：選連續的 2 列以上組成群組，之後一起搬、不會被分頁拆開 ──
function group(){
  const ix=[...sel].sort((a,b)=>a-b);
  if(ix.length<2) return alert('請先選兩列以上（點一下起點，Shift 點終點）');

  push();
  const merged=[].concat(...units.slice(ix[0],ix[0]+ix.length));
  units.splice(ix[0], ix.length, merged);
  const mapB=b=>b>ix[0] ? Math.max(ix[0]+1, b-(ix.length-1)) : b;
  breaks=breaks.map(mapB);
  breaks=breaks.filter((b,i)=>b>(i?breaks[i-1]:0));   // 群組跨越分頁時多個 break 會夾到同一格，清掉空頁
  remapLocks(mapB);
  sel.clear(); render();
}
function ungroup(){
  if(!sel.size) return;
  push();
  [...sel].sort((a,b)=>b-a).forEach(i=>{
    const u=units[i]; if(u.length<2) return;
    units.splice(i,1,...u.map(r=>[r]));
    const mapB=b=>b>i ? b+(u.length-1) : b;
    breaks=breaks.map(mapB); remapLocks(mapB);
  });
  sel.clear(); render();
}
// unit 索引一變（群組／解群），鎖住的分頁點要跟著平移，只留仍是分頁點的那些
function remapLocks(mapB){
  const next=[...locks].map(mapB).filter(b=>breaks.includes(b));
  locks.clear(); next.forEach(b=>locks.add(b));
}

function paintSel(){
  out.querySelectorAll('.row').forEach(e=>e.classList.toggle('sel', sel.has(+e.dataset.i)));
  status();
}

let dragI=null, lastI=null;
function bindDrag(){
  out.querySelectorAll('.row').forEach(e=>{
    const i=+e.dataset.i;
    // 選取一律是連續範圍：點一下設起點，Shift 點另一列拉出整段
    // 注意：這裡只換 class，不能整個 render()——重畫會把 DOM 換掉，
    // 第二次點擊落在新元素上，雙擊編輯就永遠觸發不了。
    e.onclick=ev=>{
      sel.clear();
      if(ev.shiftKey && lastI!==null)
        for(let k=Math.min(i,lastI);k<=Math.max(i,lastI);k++) sel.add(k);
      else { sel.add(i); lastI=i; }
      paintSel();
    };
    e.ondragstart=()=>dragI=i;
    e.ondragover=ev=>ev.preventDefault();
    e.ondrop=ev=>{
      ev.preventDefault();
      if(dragI===null||i===dragI) return;
      push();
      const [u]=units.splice(dragI,1); units.splice(i,0,u);
      sel.clear(); render();
    };
  });
}
</script>
